# Fix for the browser error:
#   "The 'Access-Control-Allow-Origin' header contains multiple values '*, *'"
# on https://server.mewayz.com/stremio-service/{settings,network-info,casting,device-info,...}
#
# Cause: the upstream Stremio streaming server already sends Access-Control-Allow-Origin: *, and nginx
# adds a second one. Browsers reject a response that carries two values.
# Fix: drop the upstream's CORS headers and let nginx be the only place that sets them.
# Merge this into the existing "location /stremio-service/ { ... }" block (keep your proxy_pass).

location /stremio-service/ {
    # ... existing proxy_pass / proxy_set_header lines ...

    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Expose-Headers;

    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, HEAD" always;
    add_header Access-Control-Allow-Headers "Range, Content-Type, Authorization" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;

    if ($request_method = OPTIONS) {
        add_header Access-Control-Max-Age 86400;
        add_header Content-Length 0;
        return 204;
    }
}
# Then: nginx -t && systemctl reload nginx
# Verify: curl -si https://server.mewayz.com/stremio-service/settings | grep -ci '^access-control-allow-origin'   # -> 1
