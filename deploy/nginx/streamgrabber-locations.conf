# Include inside the server {} block for server.mewayz.com, replacing the old
# "location /streamgrabber/ { proxy_pass http://127.0.0.1:7789/; ... }" block.
# CORS headers are set by the bridge (ALLOW_ORIGIN); do not add them here.

# CLI-backed lookup: expensive, so tightly rate limited.
location = /streamgrabber/grab {
    limit_req zone=sg_grab burst=6 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:7789/grab;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
}

# Signed media proxy: stream, never buffer; forward Range for seeking.
location = /streamgrabber/proxy {
    limit_req zone=sg_proxy burst=300 nodelay;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn sg_conn 20;
    proxy_pass http://127.0.0.1:7789/proxy;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_connect_timeout 5s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
}

location = /streamgrabber/health {
    allow 127.0.0.1;
    deny all;
    proxy_pass http://127.0.0.1:7789/health;
}

# Anything else under /streamgrabber/ is not served.
location /streamgrabber/ {
    return 404;
}
