# Goes in the http {} context (e.g. /etc/nginx/conf.d/00-streamgrabber-zones.conf).
#
# Behind Cloudflare, $remote_addr is a Cloudflare edge IP, so limits keyed on it would be shared by
# every visitor of that edge. Prefer the real client IP header. If you configure ngx_http_realip_module
# (set_real_ip_from <Cloudflare ranges>; real_ip_header CF-Connecting-IP;) $remote_addr is already
# correct and this map can simply use it.
map $http_cf_connecting_ip $sg_client {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}
limit_req_zone  $sg_client zone=sg_grab:10m  rate=6r/m;
limit_req_zone  $sg_client zone=sg_proxy:10m rate=50r/s;
limit_conn_zone $sg_client zone=sg_conn:10m;
